name: Shahaf schedule sync

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: "Managed profile that requested a refresh (optional)"
        required: false
        type: string
  schedule:
    # Refresh before the iPhone's 05:00 wake-alarm automation. The timezone
    # keeps this stable across Israel's daylight-saving transitions.
    - cron: "30 4 * * *"
      timezone: "Asia/Jerusalem"
    - cron: "30 6 * * *"
      timezone: "Asia/Jerusalem"
    - cron: "30 7 * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shahaf-schedule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch private managed profiles
        id: profiles
        env:
          PROFILE_SYNC_URL: https://shahaf-profile-admin.trading-api-9de14d.workers.dev/internal/profiles
          PROFILE_SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: python scripts/fetch_managed_profiles.py --output "$RUNNER_TEMP/managed-profiles.json"

      - name: Run Shahaf sync
        id: sync
        if: steps.profiles.outcome == 'success'
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL }}
        run: PYTHONPATH=src python -m shahaf_sync --config config.json --profiles-file "$RUNNER_TEMP/managed-profiles.json"

      - name: Update Alexa wake-up reminder
        if: steps.profiles.outcome == 'success' && steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          ALEXA_API_ENDPOINT: ${{ secrets.ALEXA_API_ENDPOINT }}
          ALEXA_LWA_ACCESS_TOKEN: ${{ secrets.ALEXA_LWA_ACCESS_TOKEN }}
          SCHEDULE_DATA_URL: https://epicori09-cmyk.github.io/shahaf-schedule-sync/data.json
        run: PYTHONPATH=src python scripts/update_alexa_reminder.py

      - name: Upload Pages artifact
        if: steps.profiles.outcome == 'success' && steps.sync.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages site
        id: deployment
        if: steps.profiles.outcome == 'success' && steps.sync.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Fail workflow when profile fetch or sync failed
        if: always() && (steps.profiles.outcome == 'failure' || steps.sync.outcome == 'failure')
        run: exit 1
