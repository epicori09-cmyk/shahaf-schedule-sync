name: Shahaf schedule sync

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: "Managed profile that requested a refresh (optional)"
        required: false
        type: string
  schedule:
    # Check Shahaf changes at the start of every hour. The timezone keeps the
    # schedule aligned with Israel's daylight-saving transitions.
    - cron: "0 * * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shahaf-schedule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out automation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch private managed profiles
        id: profiles
        env:
          PROFILE_SYNC_URL: https://shahaf-profile-admin.trading-api-9de14d.workers.dev/internal/profiles
          PROFILE_SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: python scripts/fetch_managed_profiles.py --output "$RUNNER_TEMP/managed-profiles.json"

      - name: Resolve Ori managed profile URL
        id: ori_profile
        if: steps.profiles.outcome == 'success'
        env:
          PROFILE_BUNDLE: ${{ runner.temp }}/managed-profiles.json
        run: |
          profile_id="$(python - "$PROFILE_BUNDLE" <<'PY'
          import json
          import sys

          bundle = json.loads(open(sys.argv[1], encoding="utf-8").read())
          matches = []
          for record in bundle.get("profiles", []):
              package = record.get("package", {})
              shahaf = package.get("shahaf", {}) if isinstance(package, dict) else {}
              if str(shahaf.get("class_id")) == "11" and int(shahaf.get("class_number", 0)) == 2:
                  matches.append(str(record.get("public_id", "")))
          if len(matches) == 1 and matches[0]:
              print(matches[0])
          PY
          )"
          if [ -n "$profile_id" ]; then
            echo "schedule_data_url=https://epicori09-cmyk.github.io/shahaf-schedule-sync/students/${profile_id}/data.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Shahaf sync
        id: sync
        if: steps.profiles.outcome == 'success'
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL }}
        run: PYTHONPATH=src python -m shahaf_sync --config config.json --profiles-file "$RUNNER_TEMP/managed-profiles.json"

      - name: Update Alexa wake-up reminder
        if: steps.profiles.outcome == 'success' && steps.sync.outcome == 'success' && steps.ori_profile.outputs.schedule_data_url != ''
        continue-on-error: true
        env:
          ALEXA_API_ENDPOINT: ${{ secrets.ALEXA_API_ENDPOINT }}
          ALEXA_LWA_ACCESS_TOKEN: ${{ secrets.ALEXA_LWA_ACCESS_TOKEN }}
          SCHEDULE_DATA_URL: ${{ steps.ori_profile.outputs.schedule_data_url }}
        run: PYTHONPATH=src python scripts/update_alexa_reminder.py

      - name: Upload Pages artifact
        if: steps.profiles.outcome == 'success' && steps.sync.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages site
        id: deployment
        if: steps.profiles.outcome == 'success' && steps.sync.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Acknowledge managed alarm commands
        if: steps.profiles.outcome == 'success' && steps.sync.outcome == 'success' && steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PROFILE_SYNC_URL: https://shahaf-profile-admin.trading-api-9de14d.workers.dev/internal/profiles
          PROFILE_SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: python scripts/ack_alarm_commands.py --profiles-file "$RUNNER_TEMP/managed-profiles.json"

      - name: Fail workflow when profile fetch or sync failed
        if: always() && (steps.profiles.outcome == 'failure' || steps.sync.outcome == 'failure')
        run: exit 1
